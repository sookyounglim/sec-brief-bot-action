name: Daily Security Briefing

on:
  schedule:
    # UTC 기준 23:00 = KST(한국시간) 다음날 08:00
    - cron: '0 23 * * *'
  workflow_dispatch: # 필요할 때 수동 실행 가능하도록 설정

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RANSOMWARE_API_KEY: ${{ secrets.RANSOMWARE_API_KEY }}
        run: python main.py
